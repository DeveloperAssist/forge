[project]
name = "forge"
version = "0.1.0"
description = "Build your own coding agent in Python: a Claude Code-style agent on free online models"
readme = "README.md"
authors = [
    { name = "Developers Assist", email = "269756727+DeveloperAssist@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "rich>=15.0.0",
]

[project.scripts]
forge = "forge.cli:main"
forge-exam = "forge.exam:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
